# Garde la base Supabase active.
# Les projets Supabase gratuits sont mis en pause après ~7 jours sans
# activité. Cette tâche interroge la base tous les 3 jours pour l'éviter.
# Elle n'utilise que la clé publique déjà présente dans index.html.
name: Garder Supabase actif

on:
  schedule:
    - cron: "17 6 */3 * *"   # tous les 3 jours, vers 6 h 17 UTC
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        env:
          URL: https://hqbgnlqimpujsmazyrpk.supabase.co
          KEY: sb_publishable_lsllBu7kh82WZx1msMGDLg_wIu6NmQQ
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/profils?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "Réponse Supabase : HTTP $code"
          test "$code" = "200"
